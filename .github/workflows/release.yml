name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            package_script: package:mac
          - os: windows-latest
            platform: windows
            package_script: package:win
          - os: ubuntu-latest
            platform: linux
            package_script: package:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        if: matrix.platform == 'linux'
        run: pnpm test

      - name: Configure optional code signing
        shell: bash
        env:
          RAW_CSC_LINK: ${{ secrets.CSC_LINK }}
          RAW_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RAW_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          RAW_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          write_env() {
            local key="$1"
            local val="$2"
            local delim="__EOF_${key}__"
            {
              echo "${key}<<${delim}"
              printf '%s\n' "${val}"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          }

          if [ -n "${RAW_CSC_LINK}" ]; then
            write_env CSC_LINK "${RAW_CSC_LINK}"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "${RAW_CSC_KEY_PASSWORD}" ]; then
            write_env CSC_KEY_PASSWORD "${RAW_CSC_KEY_PASSWORD}"
          fi
          if [ -n "${RAW_WIN_CSC_LINK}" ]; then
            write_env WIN_CSC_LINK "${RAW_WIN_CSC_LINK}"
          fi
          if [ -n "${RAW_WIN_CSC_KEY_PASSWORD}" ]; then
            write_env WIN_CSC_KEY_PASSWORD "${RAW_WIN_CSC_KEY_PASSWORD}"
          fi

      - name: Build and package (${{ matrix.platform }})
        run: pnpm run ${{ matrix.package_script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build (android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Missing required GitHub Actions secret: ${var}" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="${RUNNER_TEMP}/conductor-android-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "ANDROID_SIGNING_STORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Prepare Android version metadata
        id: android_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          VERSION_NAME="${VERSION}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build signed release Android APK
        working-directory: mobile/android
        env:
          ANDROID_REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CONDUCTOR_BUILD_VERSION: ${{ steps.android_meta.outputs.version }}
          CONDUCTOR_BUILD_RUN_NUMBER: ${{ steps.android_meta.outputs.version_code }}
          CONDUCTOR_BUILD_SHA: ${{ github.sha }}
          CONDUCTOR_BUILD_TAG: ${{ steps.android_meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest testReleaseUnitTest assembleRelease --no-daemon

      - name: Verify signed APK and prepare artifact
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.android_meta.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.android_meta.outputs.version_name }}
        run: |
          set -euo pipefail
          APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: Expected signed release APK not found at ${APK_PATH}" >&2
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(find "${SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "${BUILD_TOOLS_DIR}" ]; then
            echo "ERROR: Could not locate Android build-tools under ${SDK_ROOT}/build-tools" >&2
            exit 1
          fi

          SIGN_INFO="$("${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "${APK_PATH}")"
          echo "${SIGN_INFO}"
          if printf '%s' "${SIGN_INFO}" | grep -q "CN=Android Debug"; then
            echo "ERROR: Release APK is signed with an ephemeral Android Debug key!" >&2
            exit 1
          fi

          BADGING="$("${BUILD_TOOLS_DIR}/aapt2" dump badging "${APK_PATH}")"
          PACKAGE_LINE="$(printf '%s\n' "${BADGING}" | grep '^package:')"
          echo "${PACKAGE_LINE}"
          if ! printf '%s\n' "${PACKAGE_LINE}" | grep -q "package: name='dev.conductor.mobile' versionCode='${EXPECTED_VERSION_CODE}' versionName='${EXPECTED_VERSION_NAME}'"; then
            echo "ERROR: APK package/version metadata did not match expected versionCode=${EXPECTED_VERSION_CODE}, versionName=${EXPECTED_VERSION_NAME}" >&2
            exit 1
          fi

          mkdir -p release
          cp "${APK_PATH}" "release/conductor-android.apk"
          ls -lh release/*.apk

      - name: Clean up Android keystore
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/conductor-android-release.jks"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release metadata and checksums
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          (
            cd artifacts
            sha256sum -- * > ../SHA256SUMS.txt
          )
          mv SHA256SUMS.txt artifacts/SHA256SUMS.txt
          ls -la artifacts

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          MACOS_INSTALL_NOTE='> **macOS (unsigned build)**: After dragging `Conductor.app` to `/Applications`, if Gatekeeper says *"Conductor is damaged"*, run `xattr -cr /Applications/Conductor.app` in Terminal and reopen the app.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Conductor ${TAG}" \
              --latest \
              --notes "$MACOS_INSTALL_NOTE" \
              --generate-notes
          fi
